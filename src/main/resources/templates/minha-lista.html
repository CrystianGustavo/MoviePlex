
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Lista | MoviePlex</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="catalogo-page">

    <header class="catalogo-header">

        <a th:href="@{/inicio}" class="logo">
            <span class="logo-icon">M</span>
            <h1>Movie<span>Plex</span></h1>
        </a>

        <nav class="catalogo-nav">

            <a th:href="@{/inicio}">Início</a>

            <form th:action="@{/pesquisar}" method="get" class="pesquisa-header">
                <input type="text" name="q"
                       placeholder="Buscar filmes e séries..." required>
                <button type="submit">⌕</button>
            </form>

            <a th:href="@{/planos}">Planos</a>
            <a th:href="@{/minha-lista}" class="active">Minha Lista</a>
            <a th:href="@{/minha-conta}">Minha Conta</a>

            <span class="usuario-boas-vindas">
                Olá, <strong th:text="${nome}">Usuário</strong>
            </span>

            <a th:href="@{/sair}" class="sair-button">Sair</a>

        </nav>

    </header>

    <main class="minha-lista-container">

        <section class="minha-lista-titulo">

            <h1>Minha Lista</h1>

            <p>
                Seus filmes e séries favoritos, reunidos em um só lugar.
            </p>

        </section>

        <div class="mensagem-sucesso"
             th:if="${sucesso}"
             th:text="${sucesso}">
        </div>

        <div class="mensagem-erro"
             th:if="${erro}"
             th:text="${erro}">
        </div>

        <!-- LISTA VAZIA -->
        <section class="lista-vazia"
                 th:if="${#lists.isEmpty(conteudos)}">

            <div class="lista-vazia-icone">＋</div>

            <h2>Sua lista está vazia</h2>

            <p>
                Explore nosso catálogo e adicione filmes e séries
                para assistir depois.
            </p>

            <a th:href="@{/inicio}" class="lista-explorar-button">
                Explorar catálogo
            </a>

        </section>

        <!-- CONTEÚDOS SALVOS -->
        <section class="minha-lista-grid"
                 th:unless="${#lists.isEmpty(conteudos)}">

            <article class="lista-card"
                     th:each="conteudo : ${conteudos}">

                <a class="lista-card-imagem"
                   th:href="@{/detalhes/{id}(id=${conteudo.tmdbId}, tipo=${conteudo.tipo})}">

                    <img
                        th:if="${conteudo.posterPath != null}"
                        th:src="${'https://image.tmdb.org/t/p/w500' + conteudo.posterPath}"
                        th:alt="${conteudo.titulo}">

                    <div class="lista-sem-poster"
                         th:unless="${conteudo.posterPath != null}">
                        MoviePlex
                    </div>

                </a>

                <div class="lista-card-info">

                    <span class="lista-card-tipo"
                          th:text="${conteudo.tipo == 'movie' ? 'FILME' : 'SÉRIE'}">
                        FILME
                    </span>

                    <h3 th:text="${conteudo.titulo}">
                        Título
                    </h3>

                    <a class="lista-detalhes-button"
                       th:href="@{/detalhes/{id}(id=${conteudo.tmdbId}, tipo=${conteudo.tipo})}">
                        Ver detalhes
                    </a>

                    <form th:action="@{/minha-lista/remover}"
                          method="post">

                        <input type="hidden"
                               name="id"
                               th:value="${conteudo.id}">

                        <button type="submit"
                                class="lista-remover-button">
                            Remover da lista
                        </button>

                    </form>

                </div>

            </article>

        </section>

    </main>

</body>
</html>
